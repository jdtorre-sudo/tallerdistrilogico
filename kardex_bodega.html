<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kardex Bodega</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#dfe3ea;--line2:#eef1f5;
  --head:#1f2a3c;--head2:#2c3a52;--acc:#0f766e;--acc2:#e6f4f2;
  --ok:#15803d;--okb:#e8f6ec;--bad:#b42318;--badb:#fdecea;--blue:#1d4ed8;--blueb:#e8efff;--warn:#a15c07;--warnb:#fff4e0;
  --cont:#1d4ed8;--extra:#7c3aed;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;position:sticky;top:0;z-index:20}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
header h1 small{font-weight:400;opacity:.65;margin-left:6px}
header .sp{flex:1}
#status{font-size:12px;opacity:.9;white-space:nowrap}
#status.err{color:#ffb4ab;opacity:1;font-weight:600}
#status.dirty{color:#ffd58a}
.hbtn{background:var(--head2);border:1px solid #3c4d6b;color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:#38496a}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto;position:sticky;top:41px;z-index:19}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--mute);white-space:nowrap;font-weight:500}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:14px 16px 60px;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar h2{font-size:16px;margin:0 8px 0 0}
.bar .sp{flex:1}
.desc{color:var(--mute);margin:-4px 0 12px;max-width:900px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=month],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #99d5cf;border-color:var(--acc)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f2f5}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#0b5f58}
.btn.danger{color:var(--bad);border-color:#f2c1bc}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{color:var(--mute);font-size:12px}
.card .v{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.card .s{color:var(--mute);font-size:11.5px;margin-top:2px}
.card.ok .v{color:var(--ok)} .card.bad .v{color:var(--bad)} .card.blue .v{color:var(--blue)} .card.warn .v{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.tw{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 230px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:#f7f8fa;position:sticky;top:0;z-index:2;font-weight:600;font-size:11.5px;color:#3b4456;text-transform:uppercase;letter-spacing:.2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th.grp{cursor:default;text-align:center;font-size:11px;top:0}
th .ar{opacity:.5;margin-left:3px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:220px;max-width:380px}
tbody tr:hover td{background:#f5fbfa}
tbody tr.clk{cursor:pointer}
td input{width:90px;padding:3px 6px;text-align:right}
td input.t{width:170px;text-align:left}
td select{padding:3px 4px}
.pill{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.p-cont{background:var(--blueb);color:var(--cont)} .p-extra{background:#f1eaff;color:var(--extra)}
.p-ok{background:var(--okb);color:var(--ok)} .p-bad{background:var(--badb);color:var(--bad)} .p-blue{background:var(--blueb);color:var(--blue)}
.p-warn{background:var(--warnb);color:var(--warn)} .p-mute{background:#eef0f3;color:var(--mute)}
.neg{color:var(--bad);font-weight:600}
.pos{color:var(--blue)}
.mute{color:var(--mute)}
.more{padding:10px;text-align:center;color:var(--mute)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* modal */
#ov{position:fixed;inset:0;background:rgba(20,26,38,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
#ov.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(880px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(1200px,100%)}
.modal .mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:15px;flex:1}
.modal .mb{padding:14px 16px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .sp{flex:1}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mute);line-height:1}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.2px}
.form label.full{grid-column:1/-1}
.form label.two{grid-column:span 2}
.form label input,.form label select,.form label textarea{font-size:13px;color:var(--ink);text-transform:none;font-weight:400;letter-spacing:0}
.form h4{grid-column:1/-1;margin:6px 0 -2px;font-size:12px;color:var(--acc);border-bottom:1px solid var(--line2);padding-bottom:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 16px;cursor:pointer;font-weight:600}
.seg button.on.e{background:var(--okb);color:var(--ok)}
.seg button.on.s{background:var(--badb);color:var(--bad)}
/* item picker */
.picker{position:relative}
.picker input[type=search]{width:100%}
.picker .dd{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:300px;overflow:auto;z-index:60;display:none}
.picker .dd.on{display:block}
.picker .op{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;text-transform:none;font-weight:400;color:var(--ink);letter-spacing:0;font-size:12.5px}
.picker .op:hover,.picker .op.hi{background:var(--acc2)}
.picker .op b{font-family:Consolas,monospace;font-size:12px;min-width:120px}
.picker .op .sal{margin-left:auto;color:var(--mute)}
.sel-item{margin-top:4px;font-size:12px;text-transform:none;font-weight:400;letter-spacing:0;color:var(--ink)}
.toast{position:fixed;right:18px;background:var(--head);color:#fff;padding:10px 14px;border-radius:8px;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:420px}
.banner{background:var(--warnb);border:1px solid #f3d29b;color:#6b4004;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.welcome{max-width:760px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.welcome h2{margin:0 0 6px}
.welcome ol{padding-left:20px;line-height:1.7}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
code{background:#f1f3f6;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:12px}
.kpi-row{display:flex;gap:6px;flex-wrap:wrap}
.sumtbl td,.sumtbl th{position:static;cursor:default;padding:4px 8px}
.lock{background:#fff1f0;border:1px solid #f6c6c1;color:var(--bad);padding:8px 12px;border-radius:8px;margin-bottom:10px}
.sheetbox summary{cursor:pointer;line-height:1.6}
.sheet{max-height:440px}
.sheet th{cursor:default;position:sticky;top:0}
.sheet td{padding:1px 2px;border-right:1px solid var(--line2)}
.sheet td input,.sheet td select{width:auto;text-align:left;border:1px solid transparent;border-radius:3px;padding:4px 6px;background:transparent}
.sheet td input.nn{text-align:right}
.sheet td input:hover,.sheet td select:hover{border-color:var(--line)}
.sheet td input:focus,.sheet td select:focus{background:#fff;border-color:var(--acc);outline:2px solid #99d5cf}
.sheet td.ro{padding:2px 6px;color:var(--ink)}
.sheet .artc{white-space:normal;min-width:200px;max-width:280px;font-size:12px}
.sheet tr.ok td{background:#f3fbf5} .sheet tr.warn td{background:#fff8ec} .sheet tr.edit td{background:#fbfcfe}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.grp>summary{cursor:pointer;padding:12px 16px;display:flex;align-items:baseline;gap:10px;list-style:none;border-radius:12px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--acc);font-size:14px;transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp[open]>summary{border-bottom:1px solid var(--line2);border-radius:12px 12px 0 0}
details.grp>summary:hover{background:#f7faf9}
details.grp .gt{font-weight:600;font-size:14.5px}details.grp .gs{color:var(--mute);font-size:12px}
details.grp .gb{padding:12px 14px 4px;background:var(--bg);border-radius:0 0 12px 12px}
@media (max-width:700px){header h1 small{display:none} main{padding:12px} .tw{max-height:none}}
</style>
</head>
<body>
<header>
  <h1>Kardex Bodega <small>Inventario contable + extracontable</small></h1>
  <span class="sp"></span>
  <span id="status">Sin conectar</span>
  <button class="hbtn" id="btnUser" title="Cambiar usuario">👤 <span id="userName">—</span></button>
  <button class="hbtn" id="btnSave" title="Guardar ahora">💾 Guardar</button>
  <button class="hbtn" id="btnExport" title="Exportar a Excel">⬇ Excel</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="ov"></div>

<script>
'use strict';
/* =================== CONFIG =================== */
const DATA_FILE='inventario_datos.json';
const BACKUP_DIR='respaldos';
const COLL=['items','inicial','movs','compras','herr','perdidas','cierres','conteos','cambios','flota','recorrido','planes','tomas','tomaLineas'];
const TABS=[
  ['resumen','📈 Resumen'],['inicial','📅 Saldo inicial 1-ago'],['movs','🔄 Movimientos'],['saldo','📊 Saldo actual'],['comp','🛠️ Registro de componentes'],
  ['conteo','📝 Conteos'],['cierre','⚖️ Comparación mensual'],['compras','🛒 Compras'],['herr','🔧 Herramientas'],['perdidas','⚠️ Pérdida de insumos'],['config','⚙️ Listas y ajustes']
];
/* =================== STATE =================== */
let DB=null, dirH=null, manualMode=false, dirty=false, saving=false, pendingSave=false, lastMod=0, saveTimer=null, staleView=false;
let TAB='resumen';
const UI={}; // per-tab ui state
let USER='';
try{USER=localStorage.getItem('kardex_user')||''}catch(e){}
try{TAB=localStorage.getItem('kardex_tab')||'resumen'}catch(e){}

/* =================== UTILS =================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>v==null?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').trim().replace(/\s+/g,' ').toUpperCase();
const nowISO=()=>new Date().toISOString();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const curMonth=()=>today().slice(0,7);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=v=>Math.round((v+Number.EPSILON)*1000)/1000;
function fN(v,d=2){if(v==null||v===''||isNaN(v))return '';return Number(v).toLocaleString('es-EC',{maximumFractionDigits:d})}
function fM(v){if(v==null||v===''||isNaN(v))return '';return (v<0?'-$':'$')+Math.abs(v).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fD(s){if(!s)return '';const[y,m,d]=String(s).slice(0,10).split('-');return d?`${d}/${m}/${y}`:s}
function pNum(v){if(v==null)return null;let s=String(v).trim();if(s==='')return null;s=s.replace(/\s|\$/g,'');if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return isNaN(n)?null:n}
function monthEnd(m){const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm,0);return m+'-'+String(d.getDate()).padStart(2,'0')}
function monthName(m){const n=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];const[y,mm]=m.split('-');return n[+mm-1]+' '+y}
function monthsSince(start){const out=[];let[y,m]=start.split('-').map(Number);const[cy,cm]=curMonth().split('-').map(Number);while(y<cy||(y===cy&&m<=cm)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}return out}
function toast(msg,ms=3500){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);const lay=()=>{let y=18;$$('.toast').reverse().forEach(x=>{x.style.bottom=y+'px';y+=x.offsetHeight+8})};lay();setTimeout(()=>{t.remove();lay()},ms)}
function live(c){return (DB?.[c]||[]).filter(r=>!r.del)}

/* =================== INDEXEDDB (handle + cache) =================== */
const idb={
  _db:null,
  open(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open('kardex_bodega',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}},
  async set(k,v){try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
};

/* =================== DATA LAYER =================== */
let IDX=null, SALDO_CACHE={};
function invalidate(){IDX=null;SALDO_CACHE={}}
function idx(){
  if(IDX)return IDX;
  const items=new Map(),byCod=new Map(),byName=new Map();
  for(const it of live('items')){items.set(it.id,it);if(it.cod&&!byCod.has(norm(it.cod)))byCod.set(norm(it.cod),it);if(!byName.has(norm(it.art)))byName.set(norm(it.art),it)}
  const iniStatus=new Map();
  for(const s of live('inicial')){if(!iniStatus.has(s.itemId))iniStatus.set(s.itemId,s.obs||'')}
  const cierres=new Map(live('cierres').map(c=>[c.id,c]));
  const conteos=new Map(live('conteos').map(c=>[c.id,c]));
  IDX={items,byCod,byName,iniStatus,cierres,conteos};
  return IDX;
}
/** saldos hasta fecha (incl). excludeAjMes: excluye ajustes generados por ese cierre */
function saldos(hasta,excludeAjMes){
  const key=(hasta||'*')+'|'+(excludeAjMes||'');
  if(SALDO_CACHE[key])return SALDO_CACHE[key];
  const m=new Map();
  const g=id=>{let o=m.get(id);if(!o){o={ini:0,ent:0,sal:0,saldo:0,ult:null};m.set(id,o)}return o};
  for(const s of live('inicial')){g(s.itemId).ini+=Number(s.fis)||0}
  for(const mv of live('movs')){
    if(hasta&&mv.fecha>hasta)continue;
    if(excludeAjMes&&mv.ajusteMes===excludeAjMes)continue;
    const o=g(mv.itemId);o.ent+=Number(mv.ent)||0;o.sal+=Number(mv.sal)||0;if(!o.ult||mv.fecha>o.ult)o.ult=mv.fecha;
  }
  for(const o of m.values())o.saldo=r2(o.ini+o.ent-o.sal);
  SALDO_CACHE[key]=m;return m;
}
const sal0={ini:0,ent:0,sal:0,saldo:0};
function stamp(r){r.u=nowISO();r.by=USER||'¿?';return r}
function upsert(c,rec){stamp(rec);const a=DB[c];const i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);changed()}
function removeRec(c,id){const a=DB[c];const i=a.findIndex(x=>x.id===id);const t=stamp({id,del:true});if(i>=0)a[i]=t;else a.push(t);changed()}
function changed(){invalidate();dirty=true;setStatus('Cambios sin guardar…','dirty');clearTimeout(saveTimer);saveTimer=setTimeout(persist,900)}
function mergeDB(a,b){ // a=remoto, b=local ; gana el registro con 'u' más reciente
  const out={meta:Object.assign({},a.meta||{},b.meta||{})};
  out.listas=((b.listas?.u||'')>(a.listas?.u||''))?b.listas:a.listas||b.listas;
  for(const c of COLL){
    const m=new Map();
    for(const r of (a[c]||[]))m.set(r.id,r);
    for(const r of (b[c]||[])){const x=m.get(r.id);if(!x||(r.u||'')>(x.u||''))m.set(r.id,r)}
    out[c]=[...m.values()];
  }
  return out;
}
function sig(d){return COLL.map(c=>{const a=d[c]||[];let mx='';for(const r of a)if((r.u||'')>mx)mx=r.u;return a.length+':'+mx}).join('|')+'|'+(d.listas?.u||'')}
function fixD(v){if(!v||typeof v!=='string'||/^\d{4}-\d\d-\d\d$/.test(v))return v;const m=v.trim().replace(/\|/g,'').match(/^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})$/);if(!m)return v;
  let y,mo=+m[2],d;if(m[1].length===4){y=+m[1];d=+m[3]}else{d=+m[1];y=+m[3];if(y<100)y+=2000;const cy=new Date().getFullYear();if(y>cy&&+m[1]>=20&&+m[1]<=cy%100){y=2000+(+m[1]);d=+m[3]}}
  if(mo<1||mo>12||d<1||d>31)return v;return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function normalizeDB(d){for(const c of COLL)if(!Array.isArray(d[c]))d[c]=[];d.meta=d.meta||{};d.listas=d.listas||{};
  for(const it of d.items)if(it.tipo!=='CONTABLE'&&it.costo)it.costo=0; // solo los contables tienen costo
  for(const[c,ks]of[['herr',['fecha']],['compras',['fsol','frec']],['perdidas',['fecha']],['movs',['fecha']]])for(const r of d[c])for(const k of ks)if(r[k])r[k]=fixD(r[k]);
  return d}

/* =================== STORAGE (OneDrive folder via File System Access) =================== */
const FS_OK=('showDirectoryPicker' in window);
async function connectFolder(){
  try{
    const h=await window.showDirectoryPicker({id:'kardex',mode:'readwrite'});
    await useFolder(h,true);
  }catch(e){if(e.name!=='AbortError')toast('No se pudo abrir la carpeta: '+e.message)}
}
async function reconnect(){
  const h=await idb.get('dir');if(!h)return connectFolder();
  try{const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')throw new Error('Permiso denegado');await useFolder(h,false)}
  catch(e){toast('No se pudo reconectar: '+e.message)}
}
async function useFolder(h,fresh){
  let fh;
  try{fh=await h.getFileHandle(DATA_FILE)}catch(e){
    if(!confirmBox)return;
    const ok=await confirmBox(`En la carpeta "${h.name}" no está el archivo ${DATA_FILE}.`,'¿Crear una base vacía nueva en esa carpeta? (Si la base ya existe en otra carpeta, cancele y elija la carpeta correcta.)','Crear base nueva');
    if(!ok)return;
    fh=await h.getFileHandle(DATA_FILE,{create:true});
    const w=await fh.createWritable();await w.write(JSON.stringify(emptyDB()));await w.close();
  }
  const f=await fh.getFile();
  let data;
  try{data=JSON.parse(await f.text())}catch(e){toast('El archivo de datos está dañado o vacío. Restaure un respaldo de la carpeta "respaldos".',8000);return}
  dirH=h;manualMode=false;lastMod=f.lastModified;
  DB=normalizeDB(data);invalidate();
  await idb.set('dir',h);await idb.set('cache',DB);
  setStatus('Conectado a "'+h.name+'" · '+new Date(f.lastModified).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}));
  if(!USER)askUser();
  render();
}
function emptyDB(){return{meta:{app:'kardex-bodega',schema:1,corte:'2026-08-01',creado:nowISO()},listas:{motivoLlanta:['DESGASTE','REVENTADA','CORTADA/CHICHON','PERFORADA','POR FIN DE VIDA UTIL'],kitEmbrague:['COMPLETO','PLATO','VOLANTE'],criterio:['OK','AJUSTAR','ELIMINAR CODIGO'],nota:['CUADRADO','MAS EN FISICO QUE EN SISTEMA','MAS EN SISTEMA QUE EN FISICO'],estadoCompra:['Pendiente','Recibido','Anulada'],estadoHerr:['PENDIENTE','RECIBIDO']},items:[],inicial:[],movs:[],compras:[],herr:[],perdidas:[],cierres:[],conteos:[]}}
async function persist(){
  if(!DB)return;
  if(saving){pendingSave=true;return}
  saving=true;clearTimeout(saveTimer);
  const before=sig(DB);
  try{
    if(dirH){
      setStatus('Guardando…','dirty');
      const fh=await dirH.getFileHandle(DATA_FILE,{create:true});
      const f=await fh.getFile();
      if(f.size>0){try{const remote=JSON.parse(await f.text());DB=mergeDB(normalizeDB(remote),DB)}catch(e){}}
      DB.meta.guardado=nowISO();DB.meta.guardadoPor=USER;
      const txt=JSON.stringify(DB);
      const w=await fh.createWritable();await w.write(txt);await w.close();
      lastMod=(await fh.getFile()).lastModified;
      await dailyBackup(txt);
      setStatus('✓ Guardado '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}));
    }else{
      setStatus(manualMode?'Guardado solo en este navegador — descargue la base al terminar':'Sin carpeta conectada','dirty');
    }
    await idb.set('cache',DB);
    dirty=false;
  }catch(e){setStatus('⚠ Error al guardar: '+e.message,'err');console.error(e)}
  saving=false;
  if(sig(DB)!==before){invalidate();softRender()}
  if(pendingSave){pendingSave=false;persist()}
}
async function dailyBackup(txt){
  try{
    const d=await dirH.getDirectoryHandle(BACKUP_DIR,{create:true});
    const name='inventario_'+today()+'.json';
    let exists=true;try{await d.getFileHandle(name)}catch(e){exists=false}
    if(!exists){const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(txt);await w.close()}
  }catch(e){}
}
async function poll(){
  if(!dirH||saving)return;
  try{
    const fh=await dirH.getFileHandle(DATA_FILE);const f=await fh.getFile();
    if(f.lastModified!==lastMod){
      lastMod=f.lastModified;
      const remote=normalizeDB(JSON.parse(await f.text()));
      const before=sig(DB);DB=mergeDB(remote,DB);
      if(sig(DB)!==before){invalidate();softRender();toast('Datos actualizados'+(remote.meta?.guardadoPor?' por '+remote.meta.guardadoPor:''))}
      if(dirty)persist();
    }
  }catch(e){}
}

const SHEETS={};
function pDate(v){v=String(v||'').trim();if(!v)return '';let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){let y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if(/^\d{5}$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+Number(v)*864e5);return d.toISOString().slice(0,10)}
  return '';}
function ensureRows(s,cfg){let trail=0;for(let i=s.rows.length-1;i>=0&&cfg.isEmpty(s.rows[i]);i--)trail++;const last=[...s.rows].reverse().find(r=>!cfg.isEmpty(r));while(trail<8){s.rows.push(cfg.blank(last));trail++}}
function sheetState(key,cfg){const s=SHEETS[key]||(SHEETS[key]={rows:[]});ensureRows(s,cfg);return s}
function stHTML(r){
  if(r._st==='ok')return String(r._msg||'').startsWith('⚠')?`<span class="pill p-warn" title="${esc(r._msg)}">✓ Guardado · falta km</span>`:`<span class="pill p-ok" title="${esc(r._msg||'')}">✓ Guardado</span>`;
  if(r._st==='warn')return `<span class="pill p-warn" title="${esc(r._msg)}">⚠ ${esc(r._msg)}</span>${r._act==='create'?' <button class="btn sm" data-screate>＋ Crear</button>':''}`;
  if(r._st==='edit')return `<span class="pill p-mute">sin guardar</span>`;
  return '';
}
function sheetRowHTML(cfg,r,i){
  return `<tr data-r="${i}" class="${r._st||''}"><td class="mute n">${i+1}</td><td data-st>${stHTML(r)}</td>${cfg.cols.map(c=>{
    if(c.ro)return `<td data-ro="${c.k}" class="ro">${c.ro(r)}</td>`;
    const v=r[c.k]??'';
    if(c.t==='select'){const o=c.optsF();return `<td><select data-k="${c.k}"><option></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${v&&!o.includes(v)?`<option selected>${esc(v)}</option>`:''}</select></td>`}
    return `<td><input data-k="${c.k}" ${c.t==='date'?'type="date"':'type="text"'} ${c.t==='num'?'inputmode="decimal" class="nn"':''} ${c.list?`list="${c.list}"`:''} value="${esc(v)}" style="width:${c.w||110}px" autocomplete="off"></td>`;
  }).join('')}</tr>`;
}
function sheetHTML(key,cfg){
  const s=sheetState(key,cfg);let open=true;try{open=localStorage.getItem('sheet_'+key)!=='0'}catch(e){}
  const lists=Object.entries(cfg.lists||{}).map(([id,f])=>`<datalist id="${id}">${f()}</datalist>`).join('');
  return `<details class="panel sheetbox" data-sk="${key}" ${open?'open':''}><summary><b>✏️ Ingreso rápido — escriba como en Excel</b> <span class="mute">· Tab → siguiente columna · Enter ↓ fila de abajo · Ctrl+D copia la celda de arriba · puede pegar varias filas copiadas de Excel · cada fila se guarda sola al pasar a otra fila</span></summary>
  <div style="display:flex;gap:8px;margin:8px 0"><span class="mute" id="sk_${key}_info"></span><span style="flex:1"></span><button class="btn sm" data-sclear="${key}">Limpiar filas ya guardadas</button></div>
  <div class="tw sheet" data-sheet="${key}"><table><thead><tr><th>#</th><th>Estado</th>${cfg.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,i)=>sheetRowHTML(cfg,r,i)).join('')}</tbody></table></div>${lists}</details>`;
}
function wireSheet(key,cfg){
  const box=$(`[data-sheet="${key}"]`);if(!box)return;const s=SHEETS[key];
  const det=box.closest('details');det.addEventListener('toggle',()=>{try{localStorage.setItem('sheet_'+key,det.open?'1':'0')}catch(e){}});
  const tb=$('tbody',box);
  const rowOf=el=>+el.closest('tr').dataset.r;
  const refresh=i=>{const tr=$(`tr[data-r="${i}"]`,tb);if(!tr)return;const r=s.rows[i];tr.className=r._st||'';$('[data-st]',tr).innerHTML=stHTML(r);cfg.cols.filter(c=>c.ro).forEach(c=>{$(`[data-ro="${c.k}"]`,tr).innerHTML=c.ro(r)})};
  const grow=()=>{const n=s.rows.length;ensureRows(s,cfg);for(let i=n;i<s.rows.length;i++)tb.insertAdjacentHTML('beforeend',sheetRowHTML(cfg,s.rows[i],i))};
  const commit=i=>{const r=s.rows[i];if(!r)return;
    if(cfg.isEmpty(r)){if(r._st!=='ok'){r._st='';refresh(i)}return}
    if(r._st==='ok'&&!r._dirty)return;
    let res;try{res=cfg.save(r)}catch(e){res={err:e.message}}

function salidasReales(){return live('movs').filter(m=>m.sal>0&&!m.ajusteMes&&!m.ajuste)}
function costoLinea(m){const it=idx().items.get(m.itemId);return it?.tipo==='CONTABLE'?(m.sal||0)*(it.costo||0):0}
const dkey=m=>(m.ot||'')+'|'+(m.movil||'');
function addDays(f,n){const d=new Date(f+'T00:00:00');d.setDate(d.getDate()+Math.round(n));return d.toISOString().slice(0,10)}

function despachosMes(mes){
  const ndays=+monthEnd(mes).slice(8),days=[];for(let i=1;i<=ndays;i++)days.push({d:mes+'-'+String(i).padStart(2,'0'),desp:new Set(),lin:0,val:0,mov:new Set()});
  const moviles=new Map();let lin=0,val=0;const desp=new Set();
  for(const m of salidasReales()){if(!m.fecha||!m.fecha.startsWith(mes))continue;const o=days[+m.fecha.slice(8)-1];if(!o)continue;const k=m.fecha+'|'+dkey(m),c=costoLinea(m);
    o.desp.add(k);o.lin++;o.val+=c;if(m.movil)o.mov.add(m.movil);desp.add(k);lin++;val+=c;
    if(m.movil){let x=moviles.get(m.movil);if(!x){x={movil:m.movil,desp:new Set(),lin:0,val:0};moviles.set(m.movil,x)}x.desp.add(k);x.lin++;x.val+=c}}
  return{days,lin,val,desp:desp.size,moviles:[...moviles.values()].map(x=>({...x,desp:x.desp.size})).sort((a,b)=>b.desp-a.desp)};
}
function repetidos(desde,hasta,minVeces){
  const g=new Map(),I=idx().items;
  for(const m of salidasReales()){if(!m.movil||!m.fecha||m.fecha<desde||m.fecha>hasta)continue;const k=norm(m.movil)+'|'+m.itemId;let o=g.get(k);if(!o){o={id:k,movil:norm(m.movil),itemId:m.itemId,fechas:new Set(),ots:new Set(),cant:0,val:0};g.set(k,o)}
    o.fechas.add(m.fecha);if(m.ot)o.ots.add(m.ot);o.cant+=m.sal;o.val+=costoLinea(m)}
  return [...g.values()].filter(o=>o.fechas.size>=minVeces).map(o=>{const f=[...o.fechas].sort();let gap=1e9;for(let i=1;i<f.length;i++)gap=Math.min(gap,diffDays(f[i-1],f[i]));const it=I.get(o.itemId)||{};
    return{...o,veces:f.length,fechasL:f,gap,cod:it.cod,art:it.art,tipo:it.tipo,ots:[...o.ots]}}).sort((a,b)=>b.veces-a.veces||b.val-a.val);
}

/* =================== PREVENTIVOS (aceite, caja/corona, embrague, frenos, llantas, inyección) =================== */
const SIS=[
  {id:'aceite',n:'Aceite motor',modo:'km'},
  {id:'caja',n:'Caja y corona',modo:'km'},
  {id:'embrague',n:'Kit de embrague',modo:'km'},

  {id:'inyeccion',n:'Inyección',modo:'falla'},
  {id:'baterias',n:'Baterías',modo:'dias'}
];
const SISN=id=>SIS.find(s=>s.id===id)?.n||id;
const PREV_DEF={ventana:60,tope:365,prox:30,sis:{
  aceite:{cab:10000,pla:6000,mon:0,dias:60,pre:60,inc:'FILTRO ACEITE, FLT ACEITE',exc:'CAJA',kmInc:'ACEITE MOTOR, FILTRO, FLT, COMBUSTIBLE SECUNDARIO',kmExc:'CAJA, CORONA, HIDRAULICO, TRANSMISION, DIFERENCIAL'},
  caja:{cab:25000,pla:25000,mon:0,dias:180,pre:60,inc:'ACEITE CAJA, ACEITE DE CAJA, ACEITE CORONA, ACEITE DE CORONA, ACEITE TRANSMISION, ACEITE DIFERENCIAL',exc:'',kmInc:'ACEITE CAJA, ACEITE DE CAJA, ACEITE CORONA, ACEITE DE CORONA, ACEITE TRANSMISION, ACEITE DIFERENCIAL',kmExc:''},
  embrague:{cab:40000,pla:40000,mon:0,dias:365,pre:60,auto:true,inc:'KIT EMBRAGUE, KIT DE EMBRAGUE, DISCO DE EMBRAGUE, PLATO DE EMBRAGUE, FORRO EMBRAGUE, FORRO DE EMBRAGUE',exc:'VENTILADOR'},
  frenos:{cab:35000,pla:35000,mon:0,dias:180,pre:60,auto:true,inc:'ZAPATA, FORRO DE FRENO, BANDA DE FRENO, PASTILLAS DE FRENO',exc:'MOTO, TEMPLADOR, PERNO, RESORTE'},
  llantas:{cab:365,pla:365,mon:365,dias:365,pre:0,inc:'LLANTA',exc:'VALVULA, PARCHE',falla:'REVENTADA, CORTADA, PERFORADA, CHICHON'},
  radiador:{dias:0,pre:0,auto:true,inc:'RADIADOR',exc:'TAPA, MANGUERA, REFRIGERANTE, AGUA, ABRAZADERA'},
  inyeccion:{dias:0,pre:0,auto:true,inc:'INYECTOR, BOMBA INYEC, BOMBA DE INYEC',exc:'CAÑERIA, CANERIA, TUBERIA, SELLO, TOBERA'},
  baterias:{cab:365,pla:365,mon:365,dias:365,pre:50,auto:true,inc:'BATERIA',exc:'BORNE, TERMINAL, CABLE, AGUA, CARGADOR'}}};
const LST_DEF={aceite:['MOTOR','CAJA','CORONA','CAJA Y CORONA'],inyeccion:['BOMBA','INYECTORES','BOMBA E INYECTORES'],frenos:['ZAPATAS DELANTERAS','ZAPATAS POSTERIORES','ZAPATAS COMPLETAS'],estadoVeh:['Activo','Parado','Venta','Tramite']};
function LST(k){const v=DB?.listas?.[k];return (v&&v.length)?v:(LST_DEF[k]||[])}
function getP(){const p=DB.listas.prev||{};const o={...PREV_DEF,...p,sis:{}};for(const s of SIS)o.sis[s.id]={...PREV_DEF.sis[s.id],...(p.sis?.[s.id]||{})};return o}
const kwl=s=>String(s||'').split(',').map(x=>norm(x)).filter(Boolean);
function kmN(v){if(v==null||v==='')return null;let n=Number(v);if(isNaN(n)||n<=0)return null;if(n<5000)n=n*1000;return Math.round(n)}
function vk(s){const t=norm(s).replace(/[^A-Z0-9-]/g,'');const p=t.split(/-+/).filter(Boolean);if(!p.length)return '';const m=p[0].match(/^([A-Z]+)0*(\d+)$/);if(m&&!/^[A-Z]{3}\d{3,4}$/.test(p[0]))return m[1]+m[2];return p.join('')}
function vsplit(s){const t=norm(s).replace(/[^A-Z0-9-]/g,'');const p=t.split(/-+/).filter(Boolean);return{codigo:p[0]||t,placa:(p.length>1&&/^[A-Z]{3}\d{3,4}$/.test(p[p.length-1]))?p[p.length-1]:''}}
const tipoPref=k=>k.startsWith('DC')?'Cabezal':k.startsWith('MONT')?'Montacarga':'Plataforma';
function sisFromName(v){const t=norm(v);if(!t)return null;const s=SIS.find(x=>norm(x.n)===t||x.id===t.toLowerCase());if(s)return s.id;
  if(/CAJA|CORONA/.test(t))return 'caja';if(/ACEITE/.test(t))return 'aceite';if(/EMBRAG/.test(t))return 'embrague';if(/FRENO|ZAPATA/.test(t))return 'frenos';if(/LLANTA/.test(t))return 'llantas';if(/INYEC|BOMBA/.test(t))return 'inyeccion';if(/BATER/.test(t))return 'baterias';if(/RADIAD/.test(t))return 'radiador';return null}
function flagsOf(m){const r=[];if(m.aceite)r.push([/CAJA|CORONA/.test(norm(m.aceite))?'caja':'aceite',m.aceite]);if(m.kit)r.push(['embrague',m.kit]);if(m.frenos)r.push(['frenos',m.frenos]);if(m.motivo)r.push(['llantas',m.motivo]);if(m.inyeccion)r.push(['inyeccion',m.inyeccion]);return r}
function sugSis(it,P){const a=norm(it.art);for(const s of SIS){const r=P.sis[s.id];if(kwl(r.exc).some(w=>a.includes(w)))continue;if(kwl(r.inc).some(w=>a.includes(w)))return s.id}return null}
function kmSis(it,P){const a=norm(it.art);for(const s of SIS){const r=P.sis[s.id];if(!r.kmInc)continue;if(kwl(r.kmExc).some(w=>a.includes(w)))continue;if(kwl(r.kmInc).some(w=>a.includes(w)))return s.id}return null}
function isComponente(it,m){const f=flagsOf(m||{});if(f.length)return SISN(f[0][0]);const s=sugSis(it,getP());return s?SISN(s):null}

/* recorrido (km diarios Hunter) */
let RECX=null;
function recIdx(){
  const recs=live('recorrido');const k=recs.length+'|'+recs.reduce((a,r)=>(r.u||'')>a?r.u:a,'');
  if(RECX&&RECX.k===k)return RECX;
  const days=recs.filter(r=>r.fecha&&r.km).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const per=new Map();
  for(const d of days)for(const[v,km]of Object.entries(d.km)){if(!(km>0))continue;let o=per.get(v);if(!o){o={f:[],c:[]};per.set(v,o)}const prev=o.c.length?o.c[o.c.length-1]:0;o.f.push(d.fecha);o.c.push(prev+km)}
  const last=days.length?days[days.length-1].fecha:null,P=getP();
  const wStart=last?addDays(last,-(P.ventana-1)):null;const wDays=last?days.filter(d=>d.fecha>=wStart).length:0;
  RECX={k,per,last,first:days[0]?.fecha,wStart,wDays,nDays:days.length};return RECX;
}
function bs(arr,x){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<x)lo=m+1;else hi=m}return lo} // primer índice >= x
function kmDesde(key,f){const o=recIdx().per.get(key);if(!o)return null;const i=bs(o.f,f);const tot=o.c[o.c.length-1];return i===0?tot:tot-o.c[i-1]}
function kmEntre(key,a,b){const o=recIdx().per.get(key);if(!o)return null;const i=bs(o.f,a),j=bs(o.f,b);const ca=i===0?0:o.c[i-1],cb=j===0?0:o.c[j-1];return cb-ca}
function promDia(key){const R=recIdx();if(!R.wDays)return null;const s=kmDesde(key,R.wStart);return s==null?0:s/R.wDays}

/* flota */
function fleet(){
  const m=new Map();
  for(const f of live('flota'))m.set(f.id,{...f,key:f.id});
  return m;
}
function vehInfo(key,F){return F.get(key)||{key,id:key,codigo:key,placa:'',tipo:tipoPref(key),estado:'Activo',implicit:true}}
function intervalo(sp,tipo){return tipo==='Cabezal'?+sp.cab:tipo==='Montacarga'?+(sp.mon||0):+sp.pla}

/* núcleo: eventos + matriz + sugerencias */
let PV=null;
function prevData(){
  const sg=sig(DB);if(PV&&PV.k===sg)return PV;
  const P=getP(),I=idx().items,F=fleet(),td=today();
  const ev={};SIS.forEach(s=>ev[s.id]=[]);
  const byMov=new Map(),disc=new Set();
  for(const c of live('cambios')){
    if(c.estado==='DESCARTADO'){(c.movIds||[]).forEach(id=>disc.add(id));continue}
    const key=vk(c.movil);if(!key||!ev[c.sis])continue;
    const e={id:c.id,rec:c,key,movil:c.movil,sis:c.sis,fecha:c.fecha,km:kmN(c.km),det:c.det||'',nota:c.nota||'',origen:c.origen||'Manual',stored:true,items:[],qty:0,costo:0,movIds:[],ots:[]};
    ev[c.sis].push(e);(c.movIds||[]).forEach(id=>byMov.set(id,e));
  }
  const attach=(e,m,det)=>{const it=I.get(m.itemId)||{};e.items.push({art:it.art,q:m.sal,movId:m.id});e.qty+=m.sal;e.costo+=costoLinea(m);if(!e.km&&kmN(m.km))e.km=kmN(m.km);if(!e.det&&det)e.det=det;e.movIds.push(m.id);if(m.ot&&!e.ots.includes(m.ot))e.ots.push(m.ot)};
  const near=(sis,key,f)=>ev[sis].find(e=>e.key===key&&e.fecha&&Math.abs(diffDays(e.fecha,f))<=3);
  const sal=salidasReales().filter(m=>m.movil&&m.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const cands=[],kmPend=[];
  for(const m of sal){
    const key=vk(m.movil);if(!key)continue;
    if(byMov.has(m.id)){attach(byMov.get(m.id),m);continue}
    if(!F.has(key)&&!/^[A-Z]{1,5}\d+$/.test(key)&&!/^[A-Z]{3}\d{3,4}$/.test(key))continue; // destinos que no son vehículos (talleres, terceros…)
    const fl=flagsOf(m);
    if(fl.length){for(const[s,det]of fl){let e=near(s,key,m.fecha);if(!e){e={id:'K|'+s+'|'+key+'|'+m.fecha,key,movil:m.movil,sis:s,fecha:m.fecha,km:null,det:'',nota:'',origen:'Kardex',stored:false,items:[],qty:0,costo:0,movIds:[],ots:[]};ev[s].push(e)}attach(e,m,det)}continue}
    const it=I.get(m.itemId);if(!it)continue;
    const ks=kmSis(it,P);
    if(ks){if(kmN(m.km)){let e=near(ks,key,m.fecha);if(!e){e={id:'KM|'+ks+'|'+key+'|'+m.fecha,key,movil:m.movil,sis:ks,fecha:m.fecha,km:null,det:'',nota:'',origen:'Kardex (km registrado)',stored:false,auto:true,items:[],qty:0,costo:0,movIds:[],ots:[]};ev[ks].push(e)}attach(e,m,ks==='caja'?(/CORONA/.test(norm(it.art))?'CORONA':'CAJA'):'');continue}
      else{kmPend.push([m,key,ks,it])}}
    if(disc.has(m.id))continue;
    const s=sugSis(it,P);if(!s)continue;
    if(P.sis[s].auto){let e=near(s,key,m.fecha);if(!e){e={id:'A|'+s+'|'+key+'|'+m.fecha,key,movil:m.movil,sis:s,fecha:m.fecha,km:null,det:'',nota:'',origen:'Kardex (automático)',stored:false,auto:true,items:[],qty:0,costo:0,movIds:[],ots:[]};ev[s].push(e)}attach(e,m,detAuto(s,it.art));continue}
    cands.push([m,key,s]);
  }
  // líneas de aceite/filtros sin km: se suman al cambio del mismo móvil (±3 días) si existe
  const pendUsed=new Set();
  for(const[m,key,ks]of kmPend){const e=near(ks,key,m.fecha);if(e&&!e.movIds.includes(m.id)){attach(e,m);pendUsed.add(m.id)}}
  for(let i=cands.length-1;i>=0;i--)if(pendUsed.has(cands[i][0].id))cands.splice(i,1);
  // candidatos: si ya hay un cambio registrado ±3 días se vinculan; si no, quedan por confirmar
  const sug=new Map();
  for(const[m,key,s]of cands){const e=near(s,key,m.fecha);if(e){attach(e,m);continue}
    const id='S|'+s+'|'+key+'|'+m.fecha;let g=sug.get(id);if(!g){g={id,key,movil:m.movil,sis:s,fecha:m.fecha,km:null,items:[],qty:0,costo:0,movIds:[],ots:[]};sug.set(id,g)}attach(g,m)}
  for(const e of ev.inyeccion){if(e.det&&!e.auto)continue;const a=e.items.map(i=>norm(i.art)).join(' ');const b=/BOMBA DE INYEC|BOMBA INYEC/.test(a),i=/INYECTOR/.test(a.replace(/BOMBA DE INYECCION|BOMBA INYECCION/g,''));if(b||i)e.det=b&&i?'BOMBA E INYECTORES':b?'BOMBA':'INYECTORES'}
  // cálculo por sistema
  const mat={},allEv=[];
  for(const s of SIS){
    const sp=P.sis[s.id],list=ev[s.id].filter(e=>e.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)),byKey=new Map();
    for(const e of list){let a=byKey.get(e.key);if(!a){a=[];byKey.set(e.key,a)}a.push(e)}
    const rows=[];const keys=new Set([...F.keys(),...byKey.keys()]);
    const fal=kwl(sp.falla);
    for(const key of keys){
      const v=vehInfo(key,F),evs=byKey.get(key)||[];
      if(v.implicit&&!evs.length)continue;
      const tipo=v.tipo||tipoPref(key),intv=intervalo(sp,tipo);
      let prev=null;
      for(const e of evs){e.tipo=tipo;e.falla=fal.length&&fal.some(w=>norm(e.det).includes(w));
        if(prev){e.dDias=diffDays(prev.fecha,e.fecha);e.rec=kmEntre(key,prev.fecha,e.fecha);
          if(e.km&&prev.km&&e.km<prev.km)e.kmErr=true;
          e.dKm=(e.km&&prev.kmUse&&!e.kmErr)?e.km-prev.kmUse:(e.rec||null);
          let pct=null;if(s.modo==='km'&&intv>0&&e.dKm)pct=e.dKm/intv*100;else if(+sp.dias>0)pct=e.dDias/(+sp.dias)*100;e.pct=pct;e.prem=(+sp.pre>0)&&pct!=null&&pct<(+sp.pre)}
        if(!e.km&&prev&&prev.kmUse&&e.rec!=null)e.kmEst=prev.kmUse+e.rec;
        e.kmUse=e.km||e.kmEst||null;prev=e;allEv.push(e)}
      const last=evs[evs.length-1];
      const r={id:key,key,codigo:v.codigo,placa:v.placa,tipo,estadoVeh:v.estado||'Activo',n:evs.length,evs,last,intv,costo:evs.reduce((a,e)=>a+e.costo,0),prem:evs.filter(e=>e.prem).length,kmErr:evs.filter(e=>e.kmErr).length,fallas:evs.filter(e=>e.falla).length,uds:evs.reduce((a,e)=>a+e.qty,0)};
      const ints=evs.filter(e=>e.dDias!=null).map(e=>e.dDias),kints=evs.filter(e=>e.dKm>0).map(e=>e.dKm);
      r.avgD=ints.length?ints.reduce((a,b)=>a+b,0)/ints.length:null;r.avgK=kints.length?kints.reduce((a,b)=>a+b,0)/kints.length:null;
      r.prom=promDia(key);r.hasKm=recIdx().per.has(key);
      if(last){
        r.fechaUlt=last.fecha;r.kmUlt=last.kmUse;r.detUlt=last.det;r.recorrido=r.hasKm?kmDesde(key,last.fecha):null;
        if(s.modo==='km'&&intv>0&&r.hasKm){
          r.kmProx=r.kmUlt!=null?r.kmUlt+intv:null;r.kmAct=r.kmUlt!=null?r.kmUlt+r.recorrido:null;r.faltan=intv-r.recorrido;
          if(r.prom>=1&&r.faltan/r.prom<=P.tope){r.dias=Math.round(r.faltan/r.prom);r.fechaProy=addDays(td,r.dias)}else if(r.faltan>=0)r.bajo=true;
          r.metodo='Km';

        }

      r.estado=ev2?norm(r.estadoVeh):!last?'SIN REGISTRO':s.modo==='falla'?(r.n>=2?'REINCIDENTE':'1 DAÑO'):(r.faltan!=null&&r.faltan<0)||(r.faltan==null&&r.dias!=null&&r.dias<0)?'VENCIDO':r.bajo?'BAJO USO':(r.dias!=null&&r.dias<=P.prox)?'PRÓXIMO':r.dias==null?'SIN DATO':'OK';
      rows.push(r);

    return{...g,prevFecha:lp?.fecha,prevKm:lp?.kmUse,rec:lp?kmEntre(g.key,lp.fecha,g.fecha):null,dDias:lp?diffDays(lp.fecha,g.fecha):null,intv,pct:lp&&intv?((kmEntre(g.key,lp.fecha,g.fecha)||0)/intv*100):null}}).sort((a,b)=>b.fecha.localeCompare(a.fecha));

const estPrev=e=>({'VENCIDO':'p-bad','PRÓXIMO':'p-warn','OK':'p-ok','BAJO USO':'p-blue','SIN REGISTRO':'p-mute','SIN DATO':'p-mute','REINCIDENTE':'p-bad','1 DAÑO':'p-warn'}[e]||'p-mute');

function weekStart(f){const d=new Date(f+'T00:00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.toISOString().slice(0,10)}
function prevPlan(D,st){
  const wk=st.wk||weekStart(today());st.wk=wk;const we=addDays(wk,6);

  const weeks=[];for(let i=-8;i<=2;i++)weeks.push(addDays(weekStart(today()),i*7));if(!weeks.includes(wk))weeks.push(wk);weeks.sort().reverse();
  const done=(key,sis)=>D.allEv.find(e=>e.key===key&&e.sis===sis&&e.fecha>=wk&&e.fecha<=addDays(we,0));
  let rows,meta,av;
  if(plan){rows=plan.items.map(x=>{const e=done(x.key,x.sis);return{...x,id:x.key+'|'+x.sis,sisN:SISN(x.sis),hecho:e?.fecha||null}});}
  else{rows=[];for(const s of SIS){if(s.modo==='falla')continue;for(const r of D.mat[s.id]){if(r.estadoVeh!=='Activo'||!r.fechaProy&&r.estado!=='VENCIDO')continue;if(r.estado==='VENCIDO'||(r.fechaProy&&r.fechaProy<=we)){const e=done(r.key,s.id);rows.push({id:r.key+'|'+s.id,key:r.key,codigo:r.codigo,placa:r.placa,sis:s.id,sisN:s.n,fechaProy:r.fechaProy,faltan:r.faltan,estado:r.estado,hecho:e?.fecha||null})}}}}
  meta=rows.length;av=rows.filter(r=>r.hecho).length;
  const cols=[{k:'codigo',h:'Móvil',html:vehLbl},{k:'sisN',h:'Sistema'},{k:'estado',h:'Estado al planificar',html:r=>`<span class="pill ${estPrev(r.estado)}">${esc(r.estado)}</span>`},{k:'fechaProy',h:'Fecha proyectada',d:1},{k:'faltan',h:'Km faltantes',n:1,dec:0,cls:r=>r.faltan<0?'neg':''},
    {k:'hecho',h:'Fecha de cambio',d:1},{k:'ok',h:'Cumplido',f:r=>r.hecho?'SÍ':'',html:r=>r.hecho?'<span class="pill p-ok">✓ Cumplido</span>':'<span class="pill p-mute">Pendiente</span>'}];

  <p class="desc">Equivalente a su hoja “Registro”: la meta son los móviles activos vencidos o que se proyectan dentro de la semana. Guarde el plan el lunes; el avance se marca solo cuando se registra el cambio (desde el kardex o a mano) dentro de la semana.</p>

   ${SIS.filter(s=>s.modo!=='falla').map(s=>{const t=rows.filter(r=>r.sis===s.id);return t.length?`<div class="card"><div class="k">${esc(s.n)}</div><div class="v" style="font-size:18px">${t.filter(r=>r.hecho).length} / ${t.length}</div></div>`:''}).join('')}</div>

function prevPar(D){

function parseHunter(aoa){
  aoa=(aoa||[]).map(r=>(r||[]).map(c=>c instanceof Date?c:String(c??'').trim()));
  let hi=-1,iy=-1,im=-1,id=-1,ifc=-1;
  for(let r=0;r<Math.min(aoa.length,30);r++){const H=aoa[r].map(x=>norm(x instanceof Date?'':x));const y=H.findIndex(h=>/^A(Ñ|N)O$/.test(h)),m=H.findIndex(h=>h==='MES'),d=H.findIndex(h=>/^D(I|Í)A$/.test(h)),f=H.findIndex(h=>h==='FECHA');
    if((y>=0&&m>=0&&d>=0)||f>=0){hi=r;iy=y;im=m;id=d;ifc=(y>=0&&m>=0&&d>=0)?-1:f;break}}
  if(hi<0)return{err:'No encuentro la fila de encabezados con Año, Mes y Dia (o Fecha). Revise que sea el reporte de odómetro de Hunter.'};
  const H=aoa[hi].map(x=>String(x));const fixed=[iy,im,id,ifc].filter(i=>i>=0);
  const F=fleet(),byPlaca=new Map([...F.values()].filter(v=>v.placa).map(v=>[v.placa,v.id]));
  const cols=new Map(),nuevos=[];
  H.forEach((h,i)=>{if(fixed.includes(i)||!h||/CHASIS|^S\/?P$|CONSUMO|^A(Ñ|N)O$|^MES$|^D(I|Í)A$|^FECHA$/i.test(h.trim()))return;const sp=vsplit(h);const key=(sp.placa&&byPlaca.get(sp.placa))||vk(h);if(!key)return;
    const prev=cols.get(key);if(prev&&prev.placa&&!sp.placa)return;cols.set(key,{i,placa:sp.placa,h});if(!F.has(key)&&sp.placa&&!nuevos.find(n=>n.key===key))nuevos.push({key,h,sp})});
  const days=[];
  for(const c of aoa.slice(hi+1)){let f=null;
    if(ifc>=0){const v=c[ifc];f=v instanceof Date?v.toISOString().slice(0,10):pDate(v)}
    else{const y=+c[iy],m=+c[im],d=+c[id];if(y>2000&&m>=1&&m<=12&&d>=1&&d<=31)f=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
    if(!f)continue;const km={};for(const[key,o]of cols){const v=pNum(c[o.i]);if(v>0)km[key]=v}days.push({f,km})}
  days.sort((a,b)=>a.f.localeCompare(b.f));
  return{days,cols,nuevos};
}

function applyHunter(p){

function hunterFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv,.txt';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    let aoa;
    try{
      if(/\.(csv|txt)$/i.test(f.name)){const t=await f.text();const sep=t.split('\n')[0].includes('\t')?'\t':(t.split('\n')[0].split(';').length>t.split('\n')[0].split(',').length?';':',');aoa=t.replace(/\r/g,'').split('\n').map(l=>l.split(sep))}
      else{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});let best=null;for(const n of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});const p=parseHunter(a);if(!p.err&&(!best||p.days.length>best.p.days.length))best={a,p}}aoa=best?best.a:XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}

/* =================== KARDEX DEL SISTEMA (costos y saldos) =================== */
function parseKardexSistema(aoa){
  let hi=-1;for(let r=0;r<Math.min(aoa.length,20);r++){const H=(aoa[r]||[]).map(x=>String(x).trim().toLowerCase());if(H.includes('no_parte')&&(H.includes('costopmd')||H.includes('costou'))){hi=r;break}}
  if(hi<0)return{err:'No encuentro las columnas del kardex del sistema (no_parte, costopmd, saldo…). Use el reporte de kardex tal como sale del sistema.'};
  const H=aoa[hi].map(x=>String(x).trim().toLowerCase()),c=k=>H.indexOf(k);
  const iT=c('tipo'),iN=c('numero'),iF=c('fecha_tra'),iC=c('no_parte'),iD=c('nopartedes'),iS=c('servicio'),iP=c('costopmd'),iU=c('costou'),iSA=c('saldoant'),iSF=c('saldo'),iCA=c('costosant'),iL=c('linea');
  const num=v=>{const n=typeof v==='number'?v:pNum(v);return n==null||isNaN(n)?0:n};
  const fnum=v=>v instanceof Date?v.getTime()/864e5+25569:num(v);
  const per=new Map();let maxF=0;
  for(const r of aoa.slice(hi+1)){if(!r)continue;let cod=r[iC];if(cod===''||cod==null)continue;cod=String(cod).trim();if(!cod)continue;const f=fnum(r[iF]);if(String(r[iT]).trim()!=='.'&&f>maxF)maxF=f;let a=per.get(cod);if(!a){a=[];per.set(cod,a)}a.push(r)}
  const out=new Map();
  for(const[cod,rows]of per){
    rows.sort((a,b)=>fnum(a[iF])-fnum(b[iF])||String(a[iN]).localeCompare(String(b[iN]))||num(a[iL])-num(b[iL]));
    const last=rows[rows.length-1],t=String(last[iT]).trim();let saldo,costo;
    if(t==='.'||t===''){saldo=num(last[iSA]);costo=saldo?num(last[iCA])/saldo:0}else{saldo=num(last[iSF]);costo=num(last[iP])||num(last[iU])}
    if(!costo)for(let i=rows.length-1;i>=0;i--){const x=num(rows[i][iP])||num(rows[i][iU]);if(x){costo=x;break}}
    out.set(cod,{saldo:r2(saldo),costo:Math.round(costo*1e6)/1e6,nombre:String(last[iD]||last[iS]||'').trim()});
  }
  const corte=maxF?new Date((maxF-25569)*864e5).toISOString().slice(0,10):null;
  return{codes:out,corte};
}

        if(doSal){const id=conteoId(m,it.id);const prev=idx().conteos.get(id)||{id,mes:m,itemId:it.id};if(prev.sist!==v.saldo)upsert('conteos',{...prev,sist:v.saldo})}}
      if(doSal)for(const it of idx().items.values()){if(it.tipo!=='CONTABLE'||!it.cod||p.codes.has(it.cod))continue;if([...p.codes.keys()].some(c=>norm(c)===norm(it.cod)))continue;const id=conteoId(m,it.id);const prev=idx().conteos.get(id)||{id,mes:m,itemId:it.id};if(prev.sist!==0)upsert('conteos',{...prev,sist:0})}

function repCompData(p){
  const D=prevData(),sis=p.sis&&p.sis.length?p.sis:SIS.map(s=>s.id);
  const evs=compPeriodo(p.desde,p.hasta,sis).filter(e=>!p.movil||e.key===p.movil).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.key.localeCompare(b.key));
  const res=SIS.filter(s=>sis.includes(s.id)).map(s=>{const e=evs.filter(x=>x.sis===s.id),i=e.filter(x=>x.dDias!=null).map(x=>x.dDias),k=e.filter(x=>x.dKm>0).map(x=>x.dKm);
    return{s,n:e.length,mov:new Set(e.map(x=>x.key)).size,uds:e.reduce((a,x)=>a+x.qty,0),costo:e.reduce((a,x)=>a+x.costo,0),avgD:i.length?i.reduce((a,b)=>a+b,0)/i.length:null,avgK:k.length?k.reduce((a,b)=>a+b,0)/k.length:null,prem:e.filter(x=>x.prem).length,falla:e.filter(x=>x.falla).length}});
  const piv=new Map();for(const e of evs){let o=piv.get(e.key);if(!o){const v=vehInfo(e.key,D.F);o={key:e.key,codigo:v.codigo,placa:v.placa,c:{},costo:0,n:0};piv.set(e.key,o)}o.c[e.sis]=(o.c[e.sis]||0)+1;o.costo+=e.costo;o.n++}
  const pivL=[...piv.values()].sort((a,b)=>b.n-a.n);
  const estado=[];for(const s of SIS.filter(x=>sis.includes(x.id)&&x.modo!=='falla'))for(const r of D.mat[s.id]){if(p.movil&&r.key!==p.movil)continue;if(!r.n)continue;estado.push({s,r})}
  return{evs,res,pivL,estado,sisL:SIS.filter(s=>sis.includes(s.id))};
}

/* =================== REPORTE DE GESTIÓN DE INVENTARIO =================== */
function repInvData(p){
  const I=idx().items,S=saldos(p.hasta),movs=live('movs').filter(m=>m.fecha>=p.desde&&m.fecha<=p.hasta);
  const real=movs.filter(m=>!m.ajuste&&!m.ajusteMes),ent=real.filter(m=>m.ent>0),sal=real.filter(m=>m.sal>0),aj=movs.filter(m=>m.ajuste||m.ajusteMes);
  const vC=m=>{const it=I.get(m.itemId);return it?.tipo==='CONTABLE'?(it.costo||0):0};
  const k={entL:ent.length,entU:ent.reduce((a,m)=>a+m.ent,0),entV:ent.reduce((a,m)=>a+m.ent*vC(m),0),salL:sal.length,salU:sal.reduce((a,m)=>a+m.sal,0),salV:sal.reduce((a,m)=>a+m.sal*vC(m),0),
    desp:new Set(sal.map(m=>m.fecha+'|'+dkey(m))).size,mov:new Set(sal.filter(m=>m.movil).map(m=>norm(m.movil))).size,
    sinS3:sal.filter(m=>I.get(m.itemId)?.tipo==='CONTABLE'&&!m.s3),ajN:aj.length,ajV:aj.reduce((a,m)=>a+((m.ent||0)-(m.sal||0))*vC(m),0)};
  k.sinS3V=k.sinS3.reduce((a,m)=>a+m.sal*vC(m),0);
  const items=[...I.values()];let valor=0,neg=[],bajo=[];const saldoV=[];
  for(const it of items){const s=(S.get(it.id)||sal0).saldo;if(it.tipo==='CONTABLE'){saldoV.push({it,s,v:s*(it.costo||0)});if(s>0)valor+=s*(it.costo||0)}if(s<0)neg.push({it,s});if(it.min!=null&&s<it.min)bajo.push({it,s})}
  const top=topInsumos(p.desde,p.hasta);
  const pm=new Map();for(const m of sal){if(!m.movil)continue;const kk=norm(m.movil);let o=pm.get(kk);if(!o){o={m:kk,d:new Set(),l:0,v:0};pm.set(kk,o)}o.d.add(m.fecha+'|'+dkey(m));o.l++;o.v+=m.sal*vC(m)}
  const porMovil=[...pm.values()].map(o=>({...o,d:o.d.size})).sort((a,b)=>b.v-a.v);
  const sm=sinMovimiento(60);
  const cierres=monthsSince('2026-08').filter(m=>m+'-01'<=p.hasta&&monthEnd(m)>=p.desde).map(m=>({m,st:cierreStats(m),c:idx().cierres.get(m)}));
  const tomas=live('tomas').filter(t=>t.fecha>=p.desde&&t.fecha<=p.hasta).map(t=>({t,s:tomaStats(t)}));
  return{k,valor,neg:neg.sort((a,b)=>a.s-b.s),bajo,saldoV:saldoV.sort((a,b)=>b.v-a.v),top,porMovil,sm,cierres,tomas,movs,aj,items};
}
async function repInvExcel(p){
  try{await loadXLSX()}catch(e){return toast(e.message,5000)}
  const R=repInvData(p),k=R.k,wb=XLSX.utils.book_new(),I=idx().items;
  const res=[['REPORTE DE GESTIÓN DE INVENTARIO',p.label],['Generado',new Date().toLocaleString('es-EC')],[],['INDICADOR','VALOR'],
    ['Valor inventario contable al '+fD(p.hasta),r2(R.valor)],['Artículos (contables / extracontables)',R.items.filter(i=>i.tipo==='CONTABLE').length+' / '+R.items.filter(i=>i.tipo!=='CONTABLE').length],
    ['Entradas: líneas',k.entL],['Entradas: unidades',k.entU],['Entradas: valor contable',r2(k.entV)],['Salidas: líneas',k.salL],['Salidas: unidades',k.salU],['Salidas: valor contable',r2(k.salV)],
    ['Despachos (OT/móvil por día)',k.desp],['Móviles atendidos',k.mov],['Salidas contables sin S3: líneas',k.sinS3.length],['Salidas contables sin S3: valor',r2(k.sinS3V)],
    ['Ajustes de saldo: líneas',k.ajN],['Ajustes de saldo: valor neto',r2(k.ajV)],['Artículos en negativo',R.neg.length],['Artículos bajo mínimo',R.bajo.length],['Contables sin movimiento 60+ días',R.sm.length],['Valor inmovilizado 60+ días',r2(R.sm.reduce((a,o)=>a+o.valor,0))]];
  const ws=XLSX.utils.aoa_to_sheet(res);ws['!cols']=[{wch:42},{wch:22}];XLSX.utils.book_append_sheet(wb,ws,'RESUMEN');
  XLSX.utils.book_append_sheet(wb,sheet(['CÓDIGO','ARTÍCULO','SALDO AL '+fD(p.hasta),'COSTO','VALOR'],R.saldoV.map(o=>[o.it.cod,o.it.art,o.s,o.it.costo,r2(o.v)])),'SALDO VALORIZADO');
  XLSX.utils.book_append_sheet(wb,sheet(['CÓDIGO','ARTÍCULO','TIPO','CANTIDAD','DESPACHOS','MÓVILES','VALOR'],R.top.sort((a,b)=>b.v-a.v||b.q-a.q).map(o=>[o.it.cod,o.it.art,o.it.tipo,o.q,o.d,o.mov,r2(o.v)])),'CONSUMO POR ARTICULO');
  XLSX.utils.book_append_sheet(wb,sheet(['MÓVIL','DESPACHOS','LÍNEAS','VALOR'],R.porMovil.map(o=>[o.m,o.d,o.l,r2(o.v)])),'CONSUMO POR MOVIL');
  XLSX.utils.book_append_sheet(wb,sheet(['FECHA','TIPO','CÓDIGO','ARTÍCULO','ENTRADA','SALIDA','COSTO','VALOR','OT','MÓVIL','S3','E2','PROVEEDOR','AJUSTE','OBSERVACIONES','REGISTRÓ'],R.movs.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>{const it=I.get(m.itemId)||{};const c=it.tipo==='CONTABLE'?(it.costo||0):0;return[xd(m.fecha),it.tipo,it.cod,it.art,m.ent||null,m.sal||null,c||null,r2(((m.ent||0)+(m.sal||0))*c)||null,m.ot,m.movil,m.s3,m.e2,m.prov,m.ajuste||(m.ajusteMes?'CIERRE':''),m.obs,m.by]})),'MOVIMIENTOS DEL PERIODO');
  XLSX.utils.book_append_sheet(wb,sheet(['CÓDIGO','ARTÍCULO','TIPO','SALDO'],R.neg.map(o=>[o.it.cod,o.it.art,o.it.tipo,o.s])),'NEGATIVOS');
  XLSX.utils.book_append_sheet(wb,sheet(['CÓDIGO','ARTÍCULO','SALDO','VALOR','ÚLTIMO MOVIMIENTO'],R.sm.map(o=>[o.it.cod,o.it.art,o.saldo,r2(o.valor),xd(o.ult)])),'SIN MOVIMIENTO 60 DIAS');
  XLSX.utils.book_append_sheet(wb,sheet(['MES','ESTADO','CONTABLES CONTADOS','CUADRAN','% EXACTITUD','FALTANTES','SOBRANTES','VALOR NETO'],R.cierres.map(x=>[monthName(x.m),x.c?.estado||'ABIERTO',x.st.C.contados,x.st.C.cuadra,x.st.C.contados?x.st.C.cuadra/x.st.C.contados:null,x.st.C.falta,x.st.C.sobra,r2(x.st.C.valor)])),'CUADRE MENSUAL');
  XLSX.utils.book_append_sheet(wb,sheet(['FECHA','CONTEO','ESTADO','RESPONSABLE','ARTÍCULOS','CONTADOS','CON DIFERENCIA','VALOR DIFERENCIA','APROBÓ'],R.tomas.map(({t,s})=>[xd(t.fecha),t.nombre,t.estado,t.resp,s.n,s.cont,s.dif,r2(s.val),t.aprobadoPor])),'CONTEOS');
  XLSX.writeFile(wb,'REPORTE_GESTION_INVENTARIO_'+p.label.replace(/[^A-Za-z0-9]+/g,'_')+'.xlsx',{cellDates:true});
}
function repInvPDF(p){
  const R=repInvData(p),k=R.k;
  let h=kpH([['Valor inventario contable',fM(R.valor)],['Salidas (valor contable)',fM(k.salV)],['Entradas (valor contable)',fM(k.entV)],['Despachos',fN(k.desp)],['Móviles atendidos',fN(k.mov)],['Sin S3 (valor)',fM(k.sinS3V)]])+
    kpH([['Líneas de salida',fN(k.salL)],['Líneas de entrada',fN(k.entL)],['Ajustes de saldo',fN(k.ajN)+' · '+fM(k.ajV)],['En negativo',fN(R.neg.length)],['Bajo mínimo',fN(R.bajo.length)],['Sin movimiento 60+ días',fN(R.sm.length)+' · '+fM(R.sm.reduce((a,o)=>a+o.valor,0))]]);
  const tv=R.top.filter(o=>o.it.tipo==='CONTABLE').sort((a,b)=>b.v-a.v).slice(0,20);
  h+='<h2>Insumos contables de mayor valor</h2>'+tH(['Código','Artículo','Cantidad','Despachos','Móviles','Valor'],tv.map(o=>[esc(o.it.cod||''),esc(o.it.art),fN(o.q),o.d,o.mov,fM(o.v)]),[2,3,4,5]);
  h+='<h2>Móviles con mayor consumo</h2>'+tH(['Móvil','Despachos','Líneas','Valor'],R.porMovil.slice(0,20).map(o=>[`<b>${esc(o.m)}</b>`,o.d,o.l,fM(o.v)]),[1,2,3]);
  h+='<h2>Cuadre mensual (físico vs sistema)</h2>'+tH(['Mes','Estado','Contados','Cuadran','% exactitud','Faltantes','Sobrantes','Valor neto'],R.cierres.map(x=>[monthName(x.m),x.c?.estado||'ABIERTO',x.st.C.contados,x.st.C.cuadra,x.st.C.contados?fN(x.st.C.cuadra/x.st.C.contados*100,1)+'%':'',x.st.C.falta,x.st.C.sobra,fM(x.st.C.valor)]),[2,3,4,5,6,7]);
  if(R.tomas.length)h+='<h2>Conteos del período</h2>'+tH(['Fecha','Conteo','Estado','Responsable','Artículos','Contados','Con diferencia','Valor dif.','Aprobó'],R.tomas.map(({t,s})=>[fD(t.fecha),esc(t.nombre),t.estado,esc(t.resp||''),s.n,s.cont,s.dif,fM(s.val),esc(t.aprobadoPor||'')]),[4,5,6,7]);
  h+='<h2>Artículos contables con saldo negativo</h2>'+tH(['Código','Artículo','Saldo'],R.neg.filter(o=>o.it.tipo==='CONTABLE').slice(0,40).map(o=>[esc(o.it.cod||''),esc(o.it.art),`<span class="neg">${fN(o.s)}</span>`]),[2]);
  h+='<h2>Inventario inmovilizado (contables sin movimiento 60+ días)</h2>'+tH(['Código','Artículo','Saldo','Valor','Último movimiento'],R.sm.slice(0,30).map(o=>[esc(o.it.cod||''),esc(o.it.art),fN(o.saldo),fM(o.valor),o.ult?fD(o.ult):'sin movimientos']),[2,3]);
  h+='<p class="mute">El detalle completo (saldo valorizado de todos los artículos, movimientos del período, consumo por artículo y por móvil) está en el reporte en Excel.</p>';
  printDoc('Reporte de gestión de inventario — '+p.label,h);
}

function conteoId(mes,itemId){return mes+'|'+itemId}
function cierreRows(mes){
  const hasta=monthEnd(mes),S=saldos(hasta,mes),C=idx().conteos;
  return [...idx().items.values()].map(it=>{
    const s=S.get(it.id)||sal0,c=C.get(conteoId(mes,it.id))||{};
    const calc=s.saldo,sist=c.sist??null,fis=c.fis??null;
    const ref=it.tipo==='CONTABLE'?sist:calc; // contra qué se cuadra
    const dif=(fis!=null&&ref!=null)?r2(fis-ref):null;
    const difCalc=fis!=null?r2(fis-calc):null;
    const estado=fis==null?'Pendiente':(ref==null?'Falta saldo sistema':dif===0?'✅ CUADRA':dif>0?'🔵 SOBRA':'🔴 FALTA');
    let diag='';
    if(it.tipo==='CONTABLE'&&fis!=null&&sist!=null&&dif!==0){diag=difCalc===0?'Kardex = físico → falta registrar en SISTEMA':(r2(sist-calc)===0?'Sistema = kardex → falta registrar en KARDEX / pérdida':'Revisar: físico, sistema y kardex distintos')}
    const nota=dif==null?'':dif===0?'CUADRADO':dif>0?'MAS EN FISICO QUE EN SISTEMA':'MAS EN SISTEMA QUE EN FISICO';
    return{id:it.id,it,cod:it.cod,art:it.art,tipo:it.tipo,calc,sist,fis,dif,difCalc,pct:(dif!=null&&ref)?dif/ref:null,estado,diag,costo:it.costo||0,valor:dif!=null?dif*(it.costo||0):null,crit:c.crit||'',obs:c.obs||'',nota,movsMes:s.ent+s.sal};
  });
}
function cierreStats(mes){
  const rows=cierreRows(mes);const o=t=>{const r=rows.filter(x=>t?x.tipo==='CONTABLE':x.tipo!=='CONTABLE');const c=r.filter(x=>x.fis!=null);return{total:r.length,contados:c.length,cuadra:c.filter(x=>x.dif===0).length,falta:c.filter(x=>x.dif<0).length,sobra:c.filter(x=>x.dif>0).length,sinSist:c.filter(x=>x.dif==null).length,valor:c.reduce((a,x)=>a+(x.valor||0),0),vFalta:c.reduce((a,x)=>a+(x.valor<0?x.valor:0),0),vSobra:c.reduce((a,x)=>a+(x.valor>0?x.valor:0),0)}};
  return{rows,C:o(true),E:o(false)};
}

function pasteSistema(mes){
  const ov=openModal(`<div class="mh"><h3>Pegar saldos del sistema — ${monthName(mes)}</h3><button class="x" data-close>×</button></div>
   <div class="mb"><p class="mute" style="margin-top:0">Copie desde el reporte de existencias del sistema (Excel) dos columnas: <b>CÓDIGO</b> y <b>SALDO</b>. Opcional una tercera columna con el <b>COSTO</b> para actualizar costos. Pegue aquí:</p>
   <textarea id="pTxt" rows="12" style="width:100%;font-family:Consolas,monospace;font-size:12px" placeholder="ATF&#9;142&#10;ABRAZ3/4 3&quot;*12&#9;8&#10;…"></textarea>
   <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pCost"> Actualizar costo unitario con la 3.ª columna</label>
   <label style="display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" id="pZero" checked> Contables que no aparezcan en el reporte → saldo sistema 0</label>
   <div id="pRes" style="margin-top:10px"></div></div>
   <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn" id="pPrev">Revisar</button><button class="btn pri" id="pOk">Cargar saldos</button></div>`);
  $$('[data-close]',ov).forEach(b=>b.onclick=closeModal);
  const parse=()=>{const lines=$('#pTxt').value.split(/\r?\n/).filter(l=>l.trim());const ok=[],bad=[],nf=[];
    for(const l of lines){const c=l.split(/\t|;/).map(x=>x.trim());if(c.length<2){bad.push(l);continue}const s=pNum(c[1]);if(s==null){if(ok.length===0&&bad.length===0)continue;bad.push(l);continue}const it=idx().byCod.get(norm(c[0]));if(!it){nf.push(c);continue}ok.push({it,s,costo:pNum(c[2])})}
    return{ok,bad,nf}};
  const show=()=>{const p=parse();$('#pRes').innerHTML=`<div class="panel"><b>${p.ok.length}</b> códigos encontrados · <b class="${p.nf.length?'neg':''}">${p.nf.length}</b> códigos que no existen en el kardex · ${p.bad.length} líneas no leídas${p.nf.length?`<div style="margin-top:6px;max-height:140px;overflow:auto;font-size:12px">${p.nf.map(c=>`<div><code>${esc(c[0])}</code> saldo ${esc(c[1])} ${c[3]?esc(c[3]):''}</div>`).join('')}</div><label style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="pCreate"> Crear estos códigos como artículos CONTABLES nuevos</label>`:''}</div>`;return p};
  $('#pPrev').onclick=show;
  $('#pOk').onclick=()=>{
    const p=show();if(!p.ok.length&&!p.nf.length)return toast('No se leyó ningún código');
    const cost=$('#pCost').checked,zero=$('#pZero').checked,create=$('#pCreate')?.checked;
    const seen=new Set();
    if(create)for(const c of p.nf){const it={id:uid('I'),cod:c[0].toUpperCase(),art:(c[3]||c[0]).toUpperCase(),tipo:'CONTABLE',costo:pNum(c[2])||0,fcrea:today(),origen:'Creado desde reporte sistema '+mes};upsert('items',it);p.ok.push({it,s:pNum(c[1]),costo:null})}
    for(const {it,s,costo} of p.ok){seen.add(it.id);const id=conteoId(mes,it.id);const prev=idx().conteos.get(id)||{id,mes,itemId:it.id};upsert('conteos',{...prev,sist:s});if(cost&&costo!=null&&costo!==it.costo)upsert('items',{...it,costo})}
    if(zero)for(const it of idx().items.values()){if(it.tipo!=='CONTABLE'||seen.has(it.id))continue;const id=conteoId(mes,it.id);const prev=idx().conteos.get(id)||{id,mes,itemId:it.id};if(prev.sist!==0)upsert('conteos',{...prev,sist:0})}
    closeModal();render();toast('Saldos del sistema cargados: '+p.ok.length);
  };
}
async function adjustKardex(mes){
  if(!await requirePin('Ajustar el kardex al conteo físico de '+monthName(mes)+' cambia los saldos.'))return;
  const rows=cierreRows(mes).filter(r=>r.fis!=null&&r.difCalc!==0);
  const prev=live('movs').filter(m=>m.ajusteMes===mes);
  if(!rows.length&&!prev.length)return toast('No hay diferencias entre físico y kardex para ajustar.');
  const ok=await confirmBox('Ajustar kardex al conteo físico',`Se generarán ${rows.length} movimientos de ajuste con fecha ${fD(monthEnd(mes))} para que el kardex quede igual al físico contado${prev.length?` (reemplaza ${prev.length} ajustes anteriores de este mes)`:''}. Los artículos sin conteo no se tocan. El ajuste en el SISTEMA contable lo hace contabilidad con el reporte exportado.`,'Generar ajustes');
  if(!ok)return;
  for(const m of prev)removeRec('movs',m.id);
  for(const r of rows){const d=r.difCalc;upsert('movs',{id:uid('M'),fecha:monthEnd(mes),itemId:r.id,ent:d>0?d:0,sal:d<0?-d:0,ot:'AJUSTE CIERRE '+mes,ajusteMes:mes,ajuste:'CIERRE',obs:'Ajuste por conteo físico cierre '+monthName(mes)+(r.obs?' — '+r.obs:'')})}
  render();toast(rows.length+' ajustes generados');
}
async function closeMonth(mes){
  if(!await requirePin('Cerrar '+monthName(mes)+' bloquea sus movimientos y conteos.'))return;
  const {C,E}=cierreStats(mes);
  const ok=await confirmBox('Cerrar '+monthName(mes),`Contables contados: ${C.contados}/${C.total} · cuadran ${C.cuadra} · diferencia neta ${fM(C.valor)}. Extracontables contados: ${E.contados}. Al cerrar se bloquean conteos y movimientos con fecha de este mes.`,'Cerrar mes');
  if(!ok)return;
  upsert('cierres',{id:mes,mes,estado:'CERRADO',fecha:today(),resumen:{C,E}});render();toast('Mes cerrado');
}

  $('#cfLoad').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{try{const d=normalizeDB(JSON.parse(await inp.files[0].text()));const ok=await confirmBox('Fusionar respaldo','Se combinarán los registros del archivo con la base actual (no se borra nada; gana la versión más reciente de cada registro).','Fusionar');if(!ok)return;DB=mergeDB(d,DB);changed();render();toast('Respaldo fusionado')}catch(e){toast('Archivo no válido')}};inp.click()};
}

/* =================== EXPORT EXCEL =================== */
async function loadXLSX(){if(window.XLSX)return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('No hay conexión para cargar el exportador de Excel'));document.head.appendChild(s)})}
function sheet(head,rows){const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map(h=>({wch:Math.min(45,Math.max(10,String(h).length+2))}));ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:head.length-1}})};return ws}
const xd=s=>s?new Date(s+'T00:00:00'):null;
async function exportExcel(){
  if(!DB)return;
  try{await loadXLSX()}catch(e){return toast(e.message,5000)}
  const I=idx().items,S=saldos(),wb=XLSX.utils.book_new();
  const st=cierreStats(ui('cierre',{mes:curMonth()}).mes||curMonth());
  XLSX.utils.book_append_sheet(wb,sheet(['CÓDIGO','ARTÍCULO','TIPO','SALDO SIST AL CORTE','CONTEO INICIAL FISICO','DIFERENCIA','OBSERVACIONES','FECHA CREACION','COSTO','VALOR A AJUSTAR','CRITERIO A TOMAR','NOTA 1','CONTEO STEVEN'],live('inicial').map(r=>[r.cod,r.art,r.tipo,r.sist,r.fis,r2(r.fis-r.sist),r.obs,xd(r.fcrea),r.costo,r2((r.fis-r.sist)*r.costo),r.criterio,r.nota,r.steven])),'SALDO INICIAL 1-AGO');
  const mv=live('movs').sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  XLSX.utils.book_append_sheet(wb,sheet(['E2','S3','# FACT/G REM/ETC','PROVEEDOR','FECHA','TIPO','CÓDIGO / NOMBRE','ARTÍCULO','ENTRADA','SALIDA','SALDO ACTUAL DE ARTICULO','OT / REFERENCIA','MOVIL','DESCRIPCION LLANTA','KILOMETRAJE MOVIL','MOTIVO CAMBIO LLANTA','CAMBIO KIT DE EMBRAGUE','CAMBIO DE FRENOS','CAMBIO DE ACEITE','TRABAJO INYECCION','OBSERVACIONES','REGISTRÓ'],mv.map(m=>{const it=I.get(m.itemId)||{};return[m.e2,m.s3,m.fact,m.prov,xd(m.fecha),it.tipo,it.cod||it.art,it.art,m.ent||null,m.sal||null,(S.get(m.itemId)||sal0).saldo,m.ot,m.movil,m.llanta,m.km,m.motivo,m.kit,m.frenos,m.aceite,m.inyeccion,m.obs,m.by]})),'MOVIMIENTOS');
  const IS=idx().iniStatus;
  XLSX.utils.book_append_sheet(wb,sheet(['STATUS COD','CÓDIGO','ARTÍCULO','TIPO','SALDO INICIAL','ENTRADAS','SALIDAS','SALDO ACTUAL','ESTADO','MAXIMO','MINIMO','COSTO','VALOR'],[...I.values()].map(it=>{const s=S.get(it.id)||sal0;return[IS.get(it.id)||'',it.cod,it.art,it.tipo,s.ini,s.ent,s.sal,s.saldo,s.saldo<0?'⚠ NEGATIVO':s.saldo===0?'SIN STOCK':'OK',it.max,it.min,it.costo,r2(s.saldo*(it.costo||0))]})),'SALDO ACTUAL');
  XLSX.utils.book_append_sheet(wb,cierreSheet(st.rows),'COMPARACIÓN MENSUAL');
  XLSX.utils.book_append_sheet(wb,sheet(['FECHA SOLICITUD','RUBRO','CANTIDAD','DP','SOLICITANTE','OBSERVACION BODEGA','PROV 1','PRECIO PROV 1','PROV 2','PRECIO PROV 2','PROV 3','PRECIO PROV 3','STATUS','FECHA RECIBIDO','OBSERVACIONES','DIAS DESDE SOLICITUD','COSTO APROX','GASTO APROX'],live('compras').map(r=>[xd(r.fsol),r.rubro,r.cant,r.dp,r.solicitante,r.obsBod,r.p1,r.pp1,r.p2,r.pp2,r.p3,r.pp3,r.status,xd(r.frec),r.obs,dias(r),r.costo,r.gasto])),'COMPRAS');
  XLSX.utils.book_append_sheet(wb,sheet(['FECHA','HERRAMIENTA PRESTADA','TECNICO','ESTADO','COMENTARIO'],live('herr').map(r=>[xd(r.fecha),r.herr,r.tecnico,r.estado,r.coment])),'HERRAMIENTAS');
  XLSX.utils.book_append_sheet(wb,sheet(['FECHA','UNIDAD','SOLICITANTE','CHOFER','ACTA','CORREO DSCTO','INSUMO','NOMBRE COORDINADOR'],live('perdidas').map(r=>[xd(r.fecha),r.unidad,r.solicitante,r.chofer,r.acta,r.correo,r.insumo,r.coord])),'PERDIDA DE INSUMOS');
  {const D=prevData();const h=D.allEv.slice().sort((x,y)=>x.fecha.localeCompare(y.fecha)).map(e=>[e.movil,SISN(e.sis),xd(e.fecha),e.km||null,e.kmEst||null,e.det,e.dDias,e.dKm,e.pct!=null?Math.round(e.pct):null,e.prem?'PREMATURO':e.kmErr?'KM MENOR AL ANTERIOR':e.falla?'FALLA':e.dDias==null?'Primer registro':'OK',e.items.map(i=>i.q+' x '+i.art).join(' | '),r2(e.costo),e.origen,e.nota]);
  XLSX.utils.book_append_sheet(wb,sheet(['MOVIL','SISTEMA','FECHA DEL CAMBIO','KM DEL CAMBIO','KM ESTIMADO','DETALLE','DIAS DESDE ANTERIOR','KM DESDE ANTERIOR','% INTERVALO','VALIDACION','DESPACHADO','COSTO','ORIGEN','NOTA'],h),'PREVENTIVOS HISTORIAL');
  const m=[];for(const sd of SIS)for(const r of D.mat[sd.id])m.push([sd.n,r.codigo,r.placa,r.tipo,xd(r.fechaUlt),r.kmUlt,r.recorrido,r.kmProx,r.kmAct,r.faltan,r.prom!=null?r2(r.prom):null,r.bajo?'Bajo uso':r.dias,xd(r.fechaProy),r.estado,r.n,r.prem,r2(r.costo)]);
  XLSX.utils.book_append_sheet(wb,sheet(['SISTEMA','MOVIL','PLACA','TIPO','FECHA ULTIMO','KM ULTIMO','RECORRIDO','KM PROX','KM ACTUAL','KM FALTANTES','PROM KM/DIA','DIAS RESTANTES','FECHA PROYECTADA','ESTADO','# CAMBIOS','PREMATUROS','COSTO'],m),'PREVENTIVOS MATRIZ');}
  const rm=ui('resumen',{mes:curMonth()}).mes||curMonth();
  XLSX.utils.book_append_sheet(wb,sheet(['MOVIL','CODIGO','ARTICULO','TIPO','VECES','CANTIDAD','MIN DIAS ENTRE DESPACHOS','FECHAS','OTS','VALOR'],repetidos(rm+'-01',monthEnd(rm),2).map(r=>[r.movil,r.cod,r.art,r.tipo,r.veces,r.cant,r.gap,r.fechasL.join(' · '),r.ots.join(', '),r2(r.val)])),'DESPACHOS REPETIDOS '+rm);
  const D=despachosMes(rm);XLSX.utils.book_append_sheet(wb,sheet(['FECHA','DESPACHOS','LINEAS','MOVILES','VALOR'],D.days.map(o=>[xd(o.d),o.desp.size,o.lin,o.mov.size,r2(o.val)])),'DESPACHOS POR DIA '+rm);
  XLSX.writeFile(wb,'KARDEX_INVENTARIO_'+today()+'.xlsx',{cellDates:true});
}
function cierreSheet(rows){return sheet(['CÓDIGO','ARTÍCULO','TIPO','SALDO CALCULADO (KARDEX)','SALDO SISTEMA','CONTEO FÍSICO','DIFERENCIA','% DIF.','ESTADO','DIF. VS KARDEX','COSTO','VALOR A AJUSTAR','CRITERIO A TOMAR','NOTA 1','DIAGNÓSTICO','OBSERVACIÓN'],rows.map(r=>[r.cod,r.art,r.tipo,r.calc,r.sist,r.fis,r.dif,r.pct,r.estado,r.difCalc,r.costo,r.valor!=null?r2(r.valor):null,r.crit,r.nota,r.diag,r.obs]))}
async function exportCierre(mes){
  try{await loadXLSX()}catch(e){return toast(e.message,5000)}
  const {rows,C,E}=cierreStats(mes),wb=XLSX.utils.book_new();
  const res=[['CUADRE MENSUAL',monthName(mes)],['Estado',idx().cierres.get(mes)?.estado||'ABIERTO'],[],['','CONTABLES (físico vs sistema)','EXTRACONTABLES (físico vs kardex)'],['Artículos',C.total,E.total],['Contados',C.contados,E.contados],['Cuadran',C.cuadra,E.cuadra],['Faltantes',C.falta,E.falta],['Sobrantes',C.sobra,E.sobra],['% exactitud',C.contados?C.cuadra/C.contados:null,E.contados?E.cuadra/E.contados:null],['Valor faltante',r2(C.vFalta),r2(E.vFalta)],['Valor sobrante',r2(C.vSobra),r2(E.vSobra)],['Valor neto',r2(C.valor),r2(E.valor)]];
  const ws=XLSX.utils.aoa_to_sheet(res);ws['!cols']=[{wch:22},{wch:32},{wch:34}];
  XLSX.utils.book_append_sheet(wb,ws,'RESUMEN');
  XLSX.utils.book_append_sheet(wb,cierreSheet(rows.filter(r=>r.tipo==='CONTABLE'&&r.fis!=null&&r.dif)),'AJUSTES EN SISTEMA');
  XLSX.utils.book_append_sheet(wb,cierreSheet(rows.filter(r=>r.tipo==='CONTABLE')),'CONTABLES');
  XLSX.utils.book_append_sheet(wb,cierreSheet(rows.filter(r=>r.tipo!=='CONTABLE'&&(r.fis!=null||r.calc!==0))),'EXTRACONTABLES');
  XLSX.writeFile(wb,'CUADRE_INVENTARIO_'+mes+'.xlsx');
}

render();
(async()=>{ // reconexión automática si el navegador recuerda el permiso
  try{const h=await idb.get('dir');if(h&&h.queryPermission&&(await h.queryPermission({mode:'readwrite'}))==='granted')await useFolder(h,false)}catch(e){}
})();
</script>
